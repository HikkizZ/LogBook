# Solo desarrollo local. Postgres 18 de Docker (uuidv7() nativo); no usar el Postgres instalado en el PC.
name: logbook-dev

services:
  db-dev:
    image: postgres:18-alpine
    container_name: logbook-db-dev
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook_dev # solo dev local, enlazado a 127.0.0.1
      POSTGRES_DB: logbook
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - logbook_db_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logbook -d logbook']
      interval: 2s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:18-alpine
    container_name: logbook-db-test
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook_test # solo test, efímero
      POSTGRES_DB: logbook
    ports:
      - '127.0.0.1:5436:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logbook -d logbook']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  logbook_db_dev:
